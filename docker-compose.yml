services:
  dashboard:
    build: .
    container_name: dashboard
    restart: unless-stopped
    # Host networking: the dashboard sees the real hostname and can reach
    # Home Assistant on your LAN just like any other program on the server.
    network_mode: host
    env_file: .env
    environment:
      DISK_PATH: /host
      # Local time for spoken answers ("Es ist 6 Uhr 15") and due dates.
      TZ: Europe/Zurich
    volumes:
      # Read-only view of the host root filesystem for the disk usage meter.
      - /:/host:ro
      # User accounts (hashed passwords) and sessions survive rebuilds.
      - dashboard-data:/data

  # Cloudflare Tunnel: makes the dashboard reachable as https://dashboard.<domain>
  # without opening ports on the router. Started only with:
  #   docker compose --profile tunnel up -d
  # Needs TUNNEL_TOKEN in .env (Cloudflare Zero Trust -> Networks -> Tunnels).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    container_name: dashboard-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    # Host networking so the tunnel can reach the dashboard on 127.0.0.1.
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  dashboard-data:
