# XcodeGen spec: `xcodegen generate` creates HomeCollect.xcodeproj from this.
# Before building:
#   1. Set BASE_BUNDLE_ID below to your own reverse-DNS id (must be unique to
#      your Apple ID). The app uses it as is, the Control Center widget uses
#      <BASE_BUNDLE_ID>.widgets and the shared App Group is
#      group.<BASE_BUNDLE_ID>. That one line is all you need to change.
#   2. In Xcode pick your team for BOTH targets (HomeCollect and
#      HomeCollectWidgets) under Signing & Capabilities.
name: HomeCollect
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    BASE_BUNDLE_ID: ch.example.homecollect # <- change me
    APP_GROUP_ID: "group.$(BASE_BUNDLE_ID)"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  HomeCollect:
    type: application
    platform: iOS
    sources: [HomeCollect, Shared]
    dependencies:
      - target: HomeCollectWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BASE_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: HomeCollect/Info.plist
      properties:
        CFBundleDisplayName: HomeCollect
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        CFBundleAllowMixedLocalizations: true
        CFBundleURLTypes:
          - CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes: [homecollect]
        AppGroupID: "$(APP_GROUP_ID)" # read at runtime (Shared/SharedStore.swift)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: >-
          HomeCollect uses Face ID to unlock the app when the app lock is on.
        NSHealthShareUsageDescription: >-
          HomeCollect copies your Health data to your own home server so you
          keep the full history.
        NSLocationWhenInUseUsageDescription: >-
          HomeCollect records your location history on your own home server.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Choose "Always" so HomeCollect can record places and trips while the
          app is closed. The data only goes to your own home server.
        UIBackgroundModes: [location, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [homecollect.refresh, homecollect.backfill]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # plain http only for LAN addresses
    entitlements:
      path: HomeCollect/HomeCollect.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]

  # Control Center control "Lights" (iOS 18+). Reads the server address and
  # device token the app shares through the App Group.
  HomeCollectWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [HomeCollectWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BASE_BUNDLE_ID).widgets"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
    info:
      path: HomeCollectWidgets/Info.plist
      properties:
        CFBundleDisplayName: HomeCollect
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        CFBundleAllowMixedLocalizations: true
        AppGroupID: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: HomeCollectWidgets/HomeCollectWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
