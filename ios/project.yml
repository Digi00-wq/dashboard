# XcodeGen spec: `xcodegen generate` creates HomeCollect.xcodeproj from this.
# IDs are written out literally (no build variables):
#   app ch.diego.homecollect, widget ch.diego.homecollect.widgets,
#   App Group group.ch.diego.homecollect.
# Before building: in Xcode pick your team for BOTH targets (HomeCollect and
#   HomeCollectWidgets) under Signing & Capabilities.
name: HomeCollect
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # German UI: Localizable.xcstrings / InfoPlist.xcstrings in each target.
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
targets:
  HomeCollect:
    type: application
    platform: iOS
    sources: [HomeCollect, Shared]
    dependencies:
      - target: HomeCollectWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.diego.homecollect
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HomeCollect/Info.plist
      properties:
        CFBundleDisplayName: HomeCollect
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        CFBundleAllowMixedLocalizations: true
        CFBundleURLTypes:
          - CFBundleURLName: ch.diego.homecollect
            CFBundleURLSchemes: [homecollect]
        AppGroupID: group.ch.diego.homecollect # read at runtime (Shared/SharedStore.swift)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: >-
          HomeCollect uses Face ID to unlock the app when the app lock is on.
        NSHealthShareUsageDescription: >-
          HomeCollect copies your Health data to your own home server so you
          keep the full history.
        NSLocationWhenInUseUsageDescription: >-
          HomeCollect records your location history on your own home server.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Choose "Always" so HomeCollect can record places and trips while the
          app is closed. The data only goes to your own home server.
        UIBackgroundModes: [location, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          [homecollect.refresh, homecollect.backfill]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # plain http only for LAN addresses
    entitlements:
      path: HomeCollect/HomeCollect.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.ch.diego.homecollect]

  # Control Center control "Lights" (iOS 18+). Reads the server address and
  # device token the app shares through the App Group.
  HomeCollectWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [HomeCollectWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.diego.homecollect.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
    info:
      path: HomeCollectWidgets/Info.plist
      properties:
        CFBundleDisplayName: HomeCollect
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        CFBundleAllowMixedLocalizations: true
        AppGroupID: group.ch.diego.homecollect
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: HomeCollectWidgets/HomeCollectWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ch.diego.homecollect]
